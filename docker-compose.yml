services:
  mimicgate:
    build: .
    env_file:
      - path: .env
        required: false
    ports:
      - "${API_PORT:-11555}:11555"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - webbridge-profile:/app/.webbridge-profile
      - webbridge-data:/root/.local/share/webbridgefreeride
      - webbridge-config:/root/.config/webbridgefreeride

volumes:
  webbridge-profile:
  webbridge-data:
  webbridge-config:
