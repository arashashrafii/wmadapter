server:
  host: 127.0.0.1
  port: 11555
  # Optional. When set, clients must send Authorization: Bearer <api_key>.
  api_key:

browser:
  # managed uses Web Model Adapter's persistent profile; use cdp to attach to CDP.
  mode: managed
  headless: true
  profile_dir: ~/.local/share/wmadapter/profiles/deepseek
  executable_path:
  cdp_endpoint:
  restart_retries: 1
  # null disables the local page cap/idle cleanup explicitly.
  max_pages: 8
  idle_timeout_ms: 300000

deepseek:
  transport: web
  chat_url: https://chat.deepseek.com/
  timeout_ms: 180000
  # After a post-submit timeout, observe the same conversation without resending.
  recovery_timeout_ms: 120000
  login_timeout_ms: 30000
  system_prompt: Absolute mode. Answer briefly. No fluff, no hedging, no follow-up questions unless required.

qwen:
  chat_url: https://chat.qwen.ai/auth
  headless: false
  auth: google
  profile_dir: ~/.local/share/wmadapter/profiles/qwen
  models:
    - qwen-chat
    - qwen-image-3.0
  # Enable only after the live Qwen image UI/artifact probe succeeds.
  image_generation_verified: true
  # Keep qwen-image-3.0 unadvertised until its own Create Image flow is
  # verified; the legacy flag above preserves qwen-chat behavior.
  image_generation_verified_models:
    - qwen-chat

providers:
  default: deepseek
  enabled:
    - deepseek
  # Optional model allowlist. Omit to expose every model from enabled providers.
  enabled_models:
    - deepseek-chat

limits:
  # Measurable gateway safeguards; upstream token limits remain unknown.
  max_input_chars:
  max_output_chars:
  # Optional prompt budget; profiles may use an exact model or provider name.
  context_budget_chars: 24000
  context_budget_profiles:
    # OpenCode adds system/tool context around the user's message.
    deepseek-chat: 48000

logging:
  level: INFO
  file: wmadapter.log
  max_bytes: 1000000
  backup_count: 3
