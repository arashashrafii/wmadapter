server:
  host: 127.0.0.1
  port: 11555
  # Optional. When set, clients must send Authorization: Bearer <api_key>.
  api_key:

browser:
  # managed uses MimicGate's persistent profile; use cdp to attach to CDP.
  mode: managed
  headless: true
  profile_dir: ./.mimicgate-profile
  executable_path:
  cdp_endpoint:
  restart_retries: 1
  # null disables the local page cap/idle cleanup explicitly.
  max_pages: 8
  idle_timeout_ms: 300000

deepseek:
  transport: web
  chat_url: https://chat.deepseek.com/
  timeout_ms: 180000
  login_timeout_ms: 30000
  system_prompt: Absolute mode. Answer briefly. No fluff, no hedging, no follow-up questions unless required.

qwen:
  chat_url: https://chat.qwen.ai/
  headless: false
  auth: google
  profile_dir: ./.mimicgate-profile/qwen

providers:
  default: deepseek
  enabled:
    - deepseek

logging:
  level: INFO
  file: mimicgate.log
  max_bytes: 1000000
  backup_count: 3
